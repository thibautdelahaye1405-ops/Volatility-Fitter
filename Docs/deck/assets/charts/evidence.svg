<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, system-ui, sans-serif" role="img" aria-label="Scatter: fit error versus fit time for six models on the 25-asset spike-regime sweep; the LQD ladder sits directly below SVI-JW at the same fit time (half the error); MCS-2 is far right with a large out-of-sample gap.">
  <!-- grid -->
  <g stroke="#DCE4EE" stroke-width="1">
    <line x1="70" y1="360" x2="610" y2="360"/>
    <line x1="70" y1="277.5" x2="610" y2="277.5" stroke-dasharray="3 5"/>
    <line x1="70" y1="195" x2="610" y2="195" stroke-dasharray="3 5"/>
    <line x1="70" y1="112.5" x2="610" y2="112.5" stroke-dasharray="3 5"/>
    <line x1="70" y1="30" x2="610" y2="30" stroke-dasharray="3 5"/>
  </g>
  <!-- x ticks (log) -->
  <g fill="#8A99AD" font-size="13" text-anchor="middle">
    <text x="70" y="382">10</text>
    <text x="174" y="382">30</text>
    <text x="288" y="382">100</text>
    <text x="392" y="382">300</text>
    <text x="506" y="382">1000</text>
    <text x="610" y="382">3000</text>
  </g>
  <!-- y ticks -->
  <g fill="#8A99AD" font-size="13" text-anchor="end">
    <text x="58" y="364">0</text>
    <text x="58" y="281.5">9</text>
    <text x="58" y="199">18</text>
    <text x="58" y="116.5">27</text>
    <text x="58" y="34">36</text>
  </g>
  <!-- axis titles -->
  <text x="340" y="412" fill="#44556A" font-size="14" text-anchor="middle">median fit time per slice (ms, log scale)</text>
  <text x="16" y="195" fill="#44556A" font-size="14" text-anchor="middle" transform="rotate(-90 16 195)">weighted RMS vol error (bp)</text>
  <!-- better annotation -->
  <text x="100" y="336" fill="#8A99AD" font-size="14" font-style="italic">&#8601; better</text>

  <!-- SVI-JW (raw @1.95 harness baseline) -->
  <g>
    <title>SVI-JW — in-sample 28.9 bp, OOS 33.3 bp, 28.9 ms</title>
    <line x1="170.5" y1="95.2" x2="170.5" y2="54.7" stroke="#8A99AD" stroke-width="1.2"/>
    <circle cx="170.5" cy="54.7" r="6" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="170.5" cy="95.2" r="7.5" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
    <text x="152" y="84" fill="#44556A" font-size="15" font-weight="600" text-anchor="end">SVI-JW</text>
  </g>

  <!-- LQD ladder: same fit time as SVI, error falling with degree -->
  <g>
    <title>LQD-6 — in-sample 21.8 bp, OOS 27.2 bp, 32.7 ms</title>
    <line x1="182.2" y1="159.9" x2="182.2" y2="110.6" stroke="#8A99AD" stroke-width="1.2"/>
    <circle cx="182.2" cy="110.6" r="6" fill="none" stroke="#059669" stroke-width="2.5"/>
    <circle cx="182.2" cy="159.9" r="7.5" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
    <text x="200" y="150" fill="#44556A" font-size="15">LQD-6</text>
  </g>
  <g>
    <title>LQD-8 — in-sample 16.9 bp, OOS 22.0 bp, 28.8 ms</title>
    <line x1="170.1" y1="205.1" x2="170.1" y2="158.5" stroke="#8A99AD" stroke-width="1.2"/>
    <circle cx="170.1" cy="158.5" r="6" fill="none" stroke="#059669" stroke-width="2.5"/>
    <circle cx="170.1" cy="205.1" r="7.5" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
    <text x="152" y="209" fill="#44556A" font-size="15" text-anchor="end">LQD-8</text>
  </g>
  <g>
    <title>LQD-10 — in-sample 14.8 bp, OOS 20.1 bp, 30.1 ms</title>
    <line x1="174.3" y1="224.7" x2="174.3" y2="176.2" stroke="#8A99AD" stroke-width="1.2"/>
    <circle cx="174.3" cy="176.2" r="6" fill="none" stroke="#059669" stroke-width="2.5"/>
    <circle cx="174.3" cy="224.7" r="7.5" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <g>
    <title>LQD-12 — in-sample 14.0 bp, OOS 19.3 bp, 33.7 ms</title>
    <line x1="185.0" y1="232.1" x2="185.0" y2="183.5" stroke="#8A99AD" stroke-width="1.2"/>
    <circle cx="185.0" cy="183.5" r="6" fill="none" stroke="#059669" stroke-width="2.5"/>
    <circle cx="185.0" cy="232.1" r="7.5" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
    <text x="205" y="262" fill="#0B1520" font-size="15" font-weight="600">LQD-12</text>
    <line x1="190" y1="239" x2="204" y2="253" stroke="#8A99AD" stroke-width="1"/>
  </g>

  <!-- MCS-2 (SIV-2): buys in-sample, gives it back out-of-sample -->
  <g>
    <title>MCS-2 — in-sample 14.1 bp, OOS 25.1 bp, 247.8 ms</title>
    <line x1="373.9" y1="230.7" x2="373.9" y2="130.2" stroke="#8A99AD" stroke-width="1.2"/>
    <circle cx="373.9" cy="130.2" r="6" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
    <circle cx="373.9" cy="230.7" r="7.5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>
    <text x="390" y="240" fill="#44556A" font-size="15">MCS-2</text>
    <text x="420" y="112" fill="#8B5CF6" font-size="13.5" font-style="italic" text-anchor="middle">OOS gap = overfit</text>
  </g>
</svg>
