<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vol-Fitter — models, calibration and inference</title>
<style>
  /* ---------- deck tokens: the capabilities deck's light institutional system --- */
  :root {
    --bg:      #F4F7FA;   /* soft cool-white ground */
    --panel:   #FFFFFF;   /* card surface */
    --panel-2: #EEF2F7;   /* recessed surface */
    --line:    #D9E2EC;   /* hairline borders */
    --ink:     #0B1520;   /* primary text */
    --ink-2:   #44556A;   /* secondary text */
    --muted:   #7A8AA0;   /* captions, chrome */
    --cyan:    #0369A1;   /* observed / market */
    --amber:   #B45309;   /* prior / transported baseline */
    --green:   #047857;   /* posterior / improved */
    --violet:  #6D28D9;   /* graph posterior */
    --red:     #DC2626;   /* arbitrage / rejected */
    --fs: 1;              /* per-slide auto-fit factor (set by script when a slide overflows) */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); }
  body { font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif; color: var(--ink); overflow: hidden; }
  code, .mono { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; }

  /* ---------- fixed 1920x1080 slides, scaled to the window ---------------- */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .slide {
    width: 1920px; height: 1080px; background: var(--bg); position: absolute;
    transform-origin: center center; display: none; flex-direction: column; padding: 62px 96px 52px;
  }
  .slide.active { display: flex; }

  /* ---------- shared slide anatomy ---------------------------------------- */
  .kicker { display: flex; align-items: center; gap: 14px; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .kicker .step { color: var(--cyan); font-weight: 600; letter-spacing: .1em; }
  .kicker .tag { font-size: 17px; letter-spacing: .1em; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); background: var(--panel); }
  h1.claim { font-size: 46px; line-height: 1.12; font-weight: 650; max-width: 1600px; letter-spacing: -0.012em; margin-bottom: 14px; }
  .lede { font-size: 22.5px; line-height: 1.45; color: var(--ink-2); margin: 0 0 26px; max-width: 1660px; }
  .lede b { color: var(--ink); font-weight: 600; }

  /* body region: two columns (formula + explanation | evidence) or one */
  .body { flex: 1; min-height: 0; overflow: hidden; zoom: var(--fs); padding: 4px 0 8px; }
  .cols { display: grid; grid-template-columns: 1fr 1.35fr; gap: 56px; height: 100%; min-height: 0; }
  .cols.half { grid-template-columns: 1fr 1fr; }
  .cols.wider { grid-template-columns: .85fr 1.5fr; }
  .cols > div { display: flex; flex-direction: column; justify-content: safe center; min-height: 0; }
  .one { display: flex; flex-direction: column; justify-content: safe center; height: 100%; min-height: 0; max-width: 1640px; }

  .eqblock { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 22px; margin-bottom: 12px; }
  .eqblock.core { border-color: rgba(109,40,217,.35); background: linear-gradient(180deg, rgba(109,40,217,.05), rgba(109,40,217,.015)), var(--panel); }
  .eqblock .eqtitle { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .eq { color: var(--ink); display: flex; justify-content: center; padding: 8px 0; }
  .eq + .eq { border-top: 1px dashed rgba(217,226,236,.9); }
  .eq svg { max-width: 100%; height: auto; }
  .eq img.equation { max-width: 100%; height: auto; }   /* mathtext fallback only */
  .eqnote { font-size: 14.5px; color: var(--muted); margin-top: 8px; line-height: 1.42; }
  /* inline LaTeX inside prose: sized by the generator to the surrounding font, sat on the baseline */
  .im { display: inline-block; line-height: 0; white-space: nowrap; margin: 0 1px; color: var(--ink); }
  .im svg { display: inline-block; }
  strong .im, .k .im { color: inherit; }
  img.equation-inline { height: 1.1em; vertical-align: -0.25em; }

  ul.points { list-style: none; margin-top: 4px; }
  ul.points li { font-size: 21px; line-height: 1.45; color: var(--ink-2); padding-left: 26px; position: relative; margin-bottom: 11px; }
  ul.points li::before { content: ""; position: absolute; left: 0; top: 13px; width: 10px; height: 10px; border-radius: 3px; background: var(--cyan); }
  ul.points li:nth-child(2)::before { background: var(--green); }
  ul.points li:nth-child(3)::before { background: var(--amber); }
  ul.points li:nth-child(4)::before { background: var(--violet); }
  ul.points li strong { color: var(--ink); font-weight: 600; }
  ul.points li code { font-size: 17px; color: var(--ink); background: var(--panel-2); padding: 1px 6px; border-radius: 5px; }

  .shot { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: 0 18px 44px rgba(15,30,60,.16); }
  .shot img { display: block; width: 100%; height: auto; }
  .shot.nosb img { margin-bottom: -1.75%; }        /* hide the app's status bar on full-viewport shots */
  .shot.fit { height: 640px; width: fit-content; max-width: 100%; margin: 0 auto; }
  .shot.fit img { height: 100%; width: auto; max-width: 100%; object-fit: contain; }
  .figcard img { max-height: 640px; object-fit: contain; }
  .figcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 10px 26px rgba(15,30,60,.08); }
  .figcard img { display: block; width: 100%; height: auto; }
  .figcard.plot img { max-height: 560px; object-fit: contain; }
  .shotcap { font-size: 17px; color: var(--muted); margin-top: 10px; line-height: 1.42; }
  .shotcap .k { color: var(--ink-2); font-weight: 600; }

  table.grid { border-collapse: collapse; width: 100%; font-size: 20px; line-height: 1.38; }
  table.grid th { text-align: left; padding: 8px 14px 9px 0; color: var(--muted); font-weight: 500; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  table.grid td { padding: 11px 16px 11px 0; border-bottom: 1px solid rgba(217,226,236,.8); color: var(--ink-2); vertical-align: top; }
  table.grid td:first-child { color: var(--ink); font-weight: 600; }
  table.grid tr:last-child td { border-bottom: 0; }
  .tablecard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 22px 6px; }
  .compact table.grid { font-size: 17px; }
  .compact table.grid td { padding: 7px 12px 7px 0; }

  .strip { margin-top: 14px; padding: 12px 20px; border-left: 3px solid var(--cyan); background-color: var(--bg);
    background-image: linear-gradient(90deg, rgba(3,105,161,.06), transparent 65%); font-size: 20.5px; line-height: 1.42; color: var(--ink-2); border-radius: 0 10px 10px 0; position: relative; z-index: 1; }
  .strip b { color: var(--ink); font-weight: 600; }
  .strip .lbl { font-size: 15.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); display: block; margin-bottom: 6px; }
  .strip.amber { border-left-color: var(--amber); background-image: linear-gradient(90deg, rgba(180,83,9,.07), transparent 65%); }
  .strip.amber .lbl { color: var(--amber); }

  .demo { display: flex; gap: 12px; align-items: baseline; margin-top: 14px; font-size: 16.5px; color: var(--ink-2); line-height: 1.4; }
  .demo .lbl { flex: none; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--green); font-weight: 600; padding: 2px 10px; border: 1px solid rgba(4,120,87,.35); border-radius: 999px; }

  /* ---------- title slide -------------------------------------------------- */
  .slide.title { padding: 88px 110px 0; }
  .title .brand { font-size: 22px; letter-spacing: .28em; text-transform: uppercase; color: var(--cyan); margin-bottom: 26px; }
  .title h1 { font-size: 84px; line-height: 1.06; font-weight: 680; letter-spacing: -.015em; max-width: 1600px; color: var(--ink); }
  .title h1 .hl { color: var(--violet); }
  .title .sub { font-size: 30px; color: var(--ink-2); margin-top: 26px; max-width: 1450px; line-height: 1.45; }
  .title .agenda { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 36px; }
  .title .agenda .it { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; font-size: 19.5px; line-height: 1.42; color: var(--ink-2); }
  .title .agenda .it b { display: block; color: var(--ink); font-weight: 650; font-size: 21px; margin-bottom: 4px; }
  .title .titleshots { display: flex; gap: 20px; margin-top: 40px; }
  .title .titleshot { flex: 1; border: 1px solid var(--line); border-radius: 14px 14px 0 0; overflow: hidden; box-shadow: 0 -18px 44px rgba(15,30,60,.14); height: 340px; background: #fff; position: relative; }
  .title .titleshot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
  .title .titleshot .shotlbl { position: absolute; top: 12px; right: 12px; z-index: 2; font-size: 17px; font-weight: 600; color: var(--ink-2); background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; }
  .title .foot { color: var(--muted); }

  /* ---------- closing slide ------------------------------------------------ */
  .slide.close { justify-content: center; padding: 0 160px; }
  .close .brand { font-size: 20px; letter-spacing: .28em; text-transform: uppercase; color: var(--cyan); margin-bottom: 30px; }
  .close h1 { font-size: 60px; line-height: 1.14; font-weight: 650; letter-spacing: -.012em; max-width: 1560px; }
  .close .sub { font-size: 27px; color: var(--ink-2); margin-top: 26px; max-width: 1500px; line-height: 1.5; }
  .close ul.points { margin-top: 34px; max-width: 1500px; }
  .close ul.points li { font-size: 22px; margin-bottom: 12px; }
  .close .demo { margin-top: 26px; }

  /* ---------- footer / nav / overlays ------------------------------------- */
  .foot { position: absolute; bottom: 26px; left: 96px; right: 96px; display: flex; justify-content: space-between; align-items: center; font-size: 16.5px; color: var(--muted); letter-spacing: .06em; }
  /* progress dots along the top edge: fixed, so they never collide with the scaled footer on small windows */
  #dots { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 5; }
  #dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line); cursor: pointer; }
  #dots span.on { background: var(--cyan); }
  #dots span.sec { margin-left: 8px; }

  aside.notes { display: none; }
  body.notes-on .slide.active aside.notes { display: block; position: absolute; left: 240px; right: 240px; top: 120px; bottom: 110px; overflow: auto; z-index: 9;
    background: rgba(11,21,32,.95); color: #E6EDF5; border-radius: 16px; padding: 28px 40px; font-size: 21px; line-height: 1.55; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  aside.notes h2 { font-size: 26px; font-weight: 600; margin-bottom: 14px; color: #fff; }
  aside.notes p { margin-bottom: 14px; }
  aside.notes .note-sources { font-size: 15px; color: #9FB3C8; }

  #contents { display: none; position: fixed; inset: 6vh 12vw; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; z-index: 30; padding: 34px 44px; overflow: auto; box-shadow: 0 30px 80px rgba(15,30,60,.35); }
  #contents.open { display: block; }
  #contents h2 { font-size: 26px; font-weight: 650; margin-bottom: 18px; }
  #contents ol { columns: 2; column-gap: 44px; padding-left: 0; list-style: none; counter-reset: c; }
  #contents li { break-inside: avoid; margin: 0 0 4px; }
  #contents li.sec { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); margin: 14px 0 6px; font-weight: 600; }
  #contents button { font: inherit; color: var(--ink-2); background: none; border: 0; padding: 5px 8px; cursor: pointer; text-align: left; width: 100%; border-radius: 6px; font-size: 17px; }
  #contents button:hover, #contents button:focus-visible { background: var(--panel-2); color: var(--ink); outline: none; }
  #contents button .n { font-family: Consolas, monospace; color: var(--muted); margin-right: 10px; font-size: 14px; }
  #contents .close { position: absolute; top: 18px; right: 22px; width: auto; color: var(--muted); }

  @media print {
    body { overflow: visible; }
    #stage { position: static; }
    #dots, #contents, aside.notes { display: none !important; }
    .slide { display: flex !important; position: static; transform: none !important; page-break-after: always; }
    @page { size: 1920px 1080px; margin: 0; }
  }
</style>
</head>
<body>
<div id="stage">
<!-- SLIDES -->
</div>

<div id="dots"></div>
<div id="contents" role="dialog" aria-modal="true" aria-label="Presentation contents"><button class="close">Close · Esc</button><h2>Contents</h2><ol></ol></div>

<script>
  const slides = [...document.querySelectorAll(".slide")];
  const dots = document.getElementById("dots");
  const contents = document.getElementById("contents");
  let cur = 0;

  // ---- dots + contents (grouped by section) --------------------------------
  let lastSec = null;
  slides.forEach((el, i) => {
    const d = document.createElement("span");
    d.onclick = () => show(i);
    const sec = el.dataset.section || "";
    if (i > 0 && sec !== lastSec) d.classList.add("sec");
    dots.appendChild(d);
    const f = el.querySelector(".foot span:last-child");
    if (f && !el.classList.contains("title")) f.textContent = String(i + 1).padStart(2, "0") + " / " + slides.length;
    if (sec !== lastSec) {
      const li = document.createElement("li"); li.className = "sec"; li.textContent = sec;
      contents.querySelector("ol").appendChild(li);
      lastSec = sec;
    }
    const li = document.createElement("li"), b = document.createElement("button");
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span>${el.querySelector("h1").textContent}`;
    b.onclick = () => { show(i); closeContents(); };
    li.appendChild(b); contents.querySelector("ol").appendChild(li);
  });

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    slides.forEach((el) => (el.style.transform = `scale(${s})`));
  }
  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((el, j) => { el.classList.toggle("active", j === cur); el.setAttribute("aria-hidden", j === cur ? "false" : "true"); });
    [...dots.children].forEach((d, j) => d.classList.toggle("on", j === cur));
    history.replaceState(null, "", `#${cur + 1}`);
    document.title = `${cur + 1}. ${slides[cur].querySelector("h1").textContent} — Vol-Fitter`;
    const notes = slides[cur].querySelector("aside.notes"); if (notes) notes.scrollTop = 0;
  }

  // ---- auto-fit: shrink a slide's body uniformly (zoom) until nothing overflows.
  // Deterministic steps, applied once per slide at load, so typography stays
  // consistent across the deck instead of per-slide font juggling.
  function autofit() {
    const steps = [1, 0.95, 0.9, 0.85, 0.8, 0.75];
    slides.forEach((el) => {
      const body = el.querySelector(".body");
      if (!body) return;
      const wasActive = el.classList.contains("active");
      el.classList.add("active");
      for (const s of steps) {
        el.style.setProperty("--fs", s);
        const over = [...body.querySelectorAll(".cols > div, .one")].some((c) => c.scrollHeight > c.clientHeight + 2)
          || body.scrollHeight > body.clientHeight + 2;
        if (!over) break;
      }
      if (!wasActive) el.classList.remove("active");
    });
  }

  // ---- overlays -----------------------------------------------------------------
  let contentsReturnFocus = null;
  function closeContents() { contents.classList.remove("open"); if (contentsReturnFocus) contentsReturnFocus.focus(); }
  function toggleContents() {
    if (contents.classList.contains("open")) { closeContents(); return; }
    contentsReturnFocus = document.activeElement; contents.classList.add("open"); contents.querySelector(".close").focus();
  }
  contents.querySelector(".close").onclick = closeContents;

  addEventListener("resize", fit);
  addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (Number.isFinite(n)) show(n - 1); });
  addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeContents(); document.body.classList.remove("notes-on"); return; }
    if (contents.classList.contains("open")) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key.toLowerCase() === "n") document.body.classList.toggle("notes-on");
    else if (e.key.toLowerCase() === "o") toggleContents();
  });

  fit();
  const start = parseInt(location.hash.slice(1), 10);
  const run = () => { autofit(); show(Number.isFinite(start) && start > 0 ? start - 1 : 0); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(run); else run();
  addEventListener("load", () => { autofit(); show(cur); });
</script>
</body>
</html>
